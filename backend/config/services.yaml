services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    # RestProxyTransportFactory требует PSR-17, которого нет в проекте — явно передаём null
    Koco\Kafka\Messenger\RestProxyTransportFactory:
        arguments:
            $logger: null
            $client: null
            $requestFactory: null
            $uriFactory: null
            $streamFactory: null
