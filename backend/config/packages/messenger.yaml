framework:
    messenger:
        transports:
            security_logs:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: passfort.security.logs
                        type: direct
                    queues:
                        passfort.security.logs: ~
            notifications:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: passfort.notifications.email
                        type: direct
                    queues:
                        passfort.notifications.email: ~

            # Kafka-транспорты (отключены)
            #kafka_security_logs:
            #    dsn: 'kafka://kafka:29092'
            #    options:
            #        flushTimeout: 1000
            #        topic:
            #            name: passfort.security.logs
            #        kafka_conf:
            #            group.id: passfort-security-consumer
            #            socket.timeout.ms: '3000'
            #            message.timeout.ms: '3000'
            #kafka_notifications:
            #    dsn: 'kafka://kafka:29092'
            #    options:
            #        flushTimeout: 1000
            #        topic:
            #            name: passfort.notifications.email
            #        kafka_conf:
            #            group.id: passfort-notifications-consumer
            #            socket.timeout.ms: '3000'
            #            message.timeout.ms: '3000'

        routing:
            App\Message\SecurityLogMessage: security_logs
            App\Message\EmailNotificationMessage: notifications

# В тестовом окружении используем in-memory транспорты (без брокера сообщений)
when@test:
    framework:
        messenger:
            transports:
                security_logs: 'in-memory://'
                notifications: 'in-memory://'
